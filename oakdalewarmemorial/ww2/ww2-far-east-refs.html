            <p style="font-size: 0.95em; line-height: 1.6; color: #444; margin-bottom: 20px;">

            </p>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                
                <!-- Reference 1 -->
                <div style="border-left: 3px solid #990033; padding-left: 15px; background: #fcfbfa; padding: 10px 15px;">
                    <strong style="font-size: 0.95em; color: #222;">[1] National Army Museum – The War in the Far East (1941–1945)</strong>
                    <p style="font-size: 0.88em; line-height: 1.5; color: #555; margin: 4px 0 6px 0;">
                        Official historical overview of British and Commonwealth military commitments across Malaya, Singapore, Burma, and the wider Asia-Pacific theatre.
                    </p>
                    <a href="https://www.nam.ac.uk/explore/far-east-campaign" target="_blank" rel="noopener" style="font-size: 0.82em; color: #990033; font-weight: bold; text-decoration: none;">Explore NAM Far East Archive &rarr;</a>
                </div>

                    <p style="font-size: 0.88em; line-height: 1.5; color: #555; margin: 4px 0 6px 0;">

                    </p>
