            <div class="war-front">The Western Front</div>
            <h2 class="subhead_sm">The Battle of Guillemont</h2>
            
            <hr class="basic">
            
            <div class="display-text">In September 1916, the Battle of Guillemont erupted as a major and punishing offensive phase of the broader <a href="/oakdalewarmemorial/stories/mh-ww1_somme.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Somme Campaign</a>. The heavily fortified village of Guillemont, including the dense and heavily contested Leuze (often nicknamed 'Lousy') Wood, were critical German defensive positions that had successfully repelled multiple Allied assaults.
            <br />
            <br />
            The 16th Division, encompassing units like the 7th Battalion Princess Victoria's, was committed to break this defensive stronghold. Beginning on 3 September, fierce and bloody close-quarters fighting saw the Irish troops advance through artillery barrages and deep mud. By 5 September, elements of the division had pushed forward to relieve exhausted regiments on the southwest edges of Leuze Wood, consolidating the hard-won gains. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#the-somme-1916">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                For men like <a href="/oakdalewarmemorial/ww1/farrell_m.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Michael Farrell</a>, a Dubliner fighting alongside his Welsh comrades, the shattered terrain of the Somme proved fatal. His death during these pivotal days highlights the immense human cost required to secure a few miles of Picardy soil, a sacrifice now permanently commemorated on the towering Thiepval Memorial to the Missing.
            </div>
