            <div class="war-front">The Western Front</div>
            <h2 class="subhead_sm">Breaking the Hindenburg Line: The Battle of Épéhy</h2>
            
            <hr class="basic">
            
            <div class="display-text">In September 1918, the Allied forces launched a sweeping series of coordinated offensives designed to breach the formidable German defenses of the Hindenburg Line. As part of the Fourth Army, the 38th (Welsh) Division—including the 13th (Service) Battalion (2nd Rhondda) Welsh Regiment—faced the grueling task of assaulting heavily fortified enemy positions across sodden ground and under relentless rain.
            <br />
            <br />
            The Battle of Épéhy on 18 September 1918, served as a crucial preliminary phase. Across an eleven-mile front, troops fought fiercely to capture the strategic ridges between Verguier and Épéhy, positioned directly between the Canal du Nord and the St. Quentin Canal. Success here shattered the outer defensive belts, paving the way for the general assault on the main Hindenburg fortifications. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#hindenburg-line-1918">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                It was a profound tragedy that as the German military apparatus finally began to collapse and the promise of peace became a reality, the valley continued to lose its sons. During the brutal assault on Épéhy, 19-year-old <a href="/oakdalewarmemorial/ww1/ellway_m.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Milson Ellway</a> was killed in action. He would become the last Oakdale man to fall on the Western Front, dying just weeks before the guns finally fell silent in November 1918.
            </div>
