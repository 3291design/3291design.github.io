            <div class="war-front">The Western Front</div>
            <h2 class="subhead_sm">Early Trench Warfare in Flanders</h2>
            
            <hr class="basic">
            
            <div class="display-text">By early 1915, the sweeping movement of the opening months of the First World War had solidified into a permanent system of opposing trenches stretching across France and Belgium. Units arriving on the continent, such as the 1st Monmouthshire Regiment, found themselves thrust into the grinding realities of stationary trench warfare, holding wet and rudimentary lines in sectors around Armentières and the southern Ypres salient.
            <br />
            <br />
            Life in the front-line trenches during this transitional phase was defined by relentless sniper fire, sporadic artillery shelling, damp living conditions, and the constant peril of holding newly established positions with limited engineering support. Casualty Clearing Stations behind the lines, such as those at Bailleul, quickly filled with the steady stream of men wounded in these grinding sector exchanges. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#western-front">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The heavy toll of these early months claimed some of the valley's youngest volunteers, including 18-year-old <a href="/oakdalewarmemorial/ww1/price_a_s.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Albert Stewart Price</a>, who died of wounds on 5 April 1915. His sacrifice stands among the earliest recorded losses for Oakdale's serving soldiers on the Western Front.
            </div>
