            <h2 class="subhead_sm">Normandy and the Advance through Germany</h2>
            
            <hr class="basic">
            
            <div class="display-text">
                Beginning with the Normandy landings on D-Day in June 1944, Allied infantry forces engaged in a severe war of attrition through the dense French bocage before pushing rapidly across Belgium and Holland toward the German frontier.
                <br /><br />
                Troops endured winter trench combat in the Ardennes and hazardous river assaults across the Rhine. Even after Germany's surrender in May 1945, the physical toll of continuous combat claimed servicemen serving in the post-war demobilisation period. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww2/ww2-nw-europe.html#normandy-breakout">Read more...</a>
            </div>
            
            <hr class="main">
            
            <!-- Shared Casualty Replica Block -->
            <div class="casualty-highlight-box" style="margin-top: 30px;">
