            <div class="war-front">Honorable Discharge & Wounds</div>
            <h2 class="subhead_sm">Silver War Badge</h2>
            
            <hr class="basic">
            
            <div class="display-text">First issued in September 1916, the Silver War Badge (sometimes known as the "Wound Badge" or "Services Rendered Badge") was awarded to military personnel who were honorably discharged due to wounds or debilitating illnesses sustained on active service. Made of sterling silver and inscribed with "For King and Empire - Services Rendered," it was designed to be worn on civilian clothes.
            <br />
            <br />
            During the war, men out of uniform were often publicly shamed or handed white feathers as a symbol of alleged cowardice. The Silver War Badge provided crucial visible proof that a man had indeed done his duty for his country and had sacrificed his health in the process. It protected discharged veterans from misplaced accusations on the home front. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-return-home.html#silver-badge">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                For men like <a href="/oakdalewarmemorial/ww1/goodman_f_g.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Frederick George Goodman</a>, who survived the battlefields of France but returned with severe physical impairments, the badge was a solemn mark of his service. Discharged as surplus to military requirements due to his wounds in 1919, the badge stood as an enduring testament to his sacrifice before his eventual passing.
            </div>
