            <div class="display-text">
                Control of the Mediterranean Sea was a constant, high-stakes battle to secure essential oil supplies, protect troop transports, and keep open the vital supply line to Malta. Royal Navy crews faced continuous air strikes from Axis bombers, hidden submarine wolfpacks, and heavy naval minefields.
                <br /><br />
                Operating under blistering heat and constant threat of attack, warship crews endured multi-day convoy sweeps through bomb-alley passages where a single torpedo or mine strike meant catastrophic sinking in deep, open waters. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww2/ww2-mediterranean.html#naval-patrols">Read more...</a>
