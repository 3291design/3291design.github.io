            <h2 class="subhead_sm">Defense of the Realm (1939–1943)</h2>
            
            <hr class="basic">
            
            <div class="display-text">
                The hazards of wartime service were not restricted to overseas combat. During the darkest years of the conflict, the United Kingdom was an active theatre of risk where personnel faced dangerous home-defense duties, high-risk bomb disposal, anti-aircraft air defense, and intensive training operations.
                <br /><br />
                Between 1940 and 1943, eight servicemen from Oakdale gave their lives on British soil while protecting the mainland and sustaining the domestic machinery of war. Brought home to local chapelyards, their ultimate sacrifice remains proudly remembered. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww2/ww2-home-front.html#home-front">Read more...</a>
            </div>
