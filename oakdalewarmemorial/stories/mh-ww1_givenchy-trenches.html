            <div class="war-front">The Western Front</div>
            <div class="subhead_sm">The Givenchy-lès-la-Bassée Sector</div>
            
            <hr class="main" style="margin: 15px auto; width: 100%;">
            
            <div class="display-text">Following the devastation at Ypres, the 1/1st Battalion of the Monmouthshire Regiment was relocated south to the Givenchy-lès-la-Bassée sector in late 1915. This area was infamous for heavily flooded trenches and intense underground mine warfare. Rather than simply manning the line, the local boys from the Western Valleys were tasked with draining flooded galleries and fortifying mud-clogged ramparts.
            <br />
            <br />
            It was in these punishing conditions that their Welsh colliery expertise shone. Their unparalleled work with picks and shovels in the waterlogged trenches prompted the military to officially re-designate the Monmouthshires as specialist Pioneer battalions. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#givenchy-1916">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The grueling, static trench conditions at Givenchy demanded extraordinary endurance from the valley men who worked the subterranean infrastructure. The severe physical toll of this pioneer work is remembered through the sacrifices of men like <a href="/oakdalewarmemorial/ww1/williams_j_t.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. John T. Williams</a> who gave his life amidst the mud and constant shellfire of the sector.
            </div>
        </div>
