            <div class="war-front">Beyond the Western Front</div>
            <h2 class="subhead_sm">The Mesopotamian Campaign</h2>
            
            <hr class="basic">
            
            <div class="display-text">The Mesopotamian Campaign was a grueling theater of the First World War, fought primarily against the Ottoman Empire in the unforgiving terrain of the Tigris and Euphrates river valleys (in modern-day Iraq). By early 1916, Allied efforts were desperately focused on a single objective: relieving a large British and Indian garrison besieged by Turkish forces at the town of Kut-al-Amara.
            <br />
            <br />
            Relief forces included the 4th Battalion South Wales Borderers who faced hardships of extreme heat, rampant disease, and torrential rains that turned the desert into deep, impassable quagmires. The Ottoman defenders were heavily entrenched in strategic choke points, most notably at Sannaiyat. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-beyond-western.html#mesopotamia-theater">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                All attempts to break through exacted a terrible toll on the men from South Wales. <a href="/oakdalewarmemorial/ww1/howard_f_h.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Acting Corporal Frank Herbert Howard</a> fell during a bloody frontal assault across open ground at Sannaiyat on 9 April 1916. Weeks later, on 22 April, <a href="/oakdalewarmemorial/ww1/harvey_r_h.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Richard Henry Harvey</a> was likewise killed in action during another desperate assault of Sannaiyat. Sadly, just days after these failed attacks, the starving garrison at Kut was forced to surrender.
            </div>
        </div>
