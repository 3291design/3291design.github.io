            <h2 class="subhead_sm">Pacific Naval Campaign</h2>
            <hr class="basic">
            <div class="display-text">
                In early 1942, multinational naval forces of ABDA Command attempted to halt the rapid southward advance of the Imperial Japanese Navy across the Dutch East Indies. Royal Navy destroyers and cruisers engaged superior Japanese surface fleets in high-stakes night actions without air cover.
                <br /><br />
                Naval crews faced sudden loss from torpedoes, air attacks, and naval minefields, fighting to protect vital sea lanes and troop transports during the chaotic defense of Java. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww2/ww2-far-east.html#pacific-command">Read more...</a>
            </div>
