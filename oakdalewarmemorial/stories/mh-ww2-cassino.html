            <h2 class="subhead_sm">Monte Cassino & Mountain Lines</h2>
            
            <hr class="basic">
            
            <div class="display-text">
                The German Gustav Line, anchored around the historic hilltop monastery of Monte Cassino, presented one of the most formidable natural and military defenses of World War II. Allied infantry faced four brutal offensives up exposed rocky slopes under heavy machine-gun and mortar fire before breaking through.
                <br /><br />
                Following the capture of Cassino in May 1944, Allied armies pursued German forces into the northern Apennine Mountains, enduring another grueling winter campaign of house-to-house fighting and icy river crossings along the Gothic Line. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww2/ww2-italian-campaign.html#cassino-mountains">Read more...</a>
            </div>
            
            <hr class="main">
            
            <!-- Shared Casualty Replica Block (Section 2 Servicemen) -->
            <div class="casualty-highlight-box" style="margin-top: 30px;">
