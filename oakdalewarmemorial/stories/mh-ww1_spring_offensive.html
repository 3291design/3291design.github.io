            <div class="war-front">The Western Front</div>
            <div class="subhead_sm">German Spring Offensive</div>
            
            <hr class="basic">
            
            <div class="display-text">The final year of the war opened with the overwhelming fury of the Kaiserschlacht—the German Spring Offensive of March 1918. Attacking out of a thick morning fog, German stormtroopers shattered the British front lines, forcing the Pioneer battalions into frantic rearguard actions.
            <br />
            <br />
            The men of the Monmouthshires fought a desperate, bloody retreating action across the very same Somme battlefields they had bled to capture two years prior. It was a war of movement unseen since 1914, with units entirely cut off in the confusion. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#spring-offensive-1918">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                It was a war of movement that had not been seen since 1914. Bridges were blown, supply dumps were torched, and units were entirely cut off in the confusion. As British and Empire forces struggled to stabilize the crumbling line, the casualties spiked dramatically. Men from Oakdale <a href="/oakdalewarmemorial/ww1/owens_a.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Arthur Owens</a> and <a href="/oakdalewarmemorial/ww1/wiltshire_g.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Gunner George Wiltshire</a>, fell during this harrowing withdrawal, buying precious time for the Allied lines to finally hold outside of Amiens.
            </div>
        </div>
