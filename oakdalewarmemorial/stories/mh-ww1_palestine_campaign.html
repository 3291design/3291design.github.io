             <div class="war-front">Beyond the Western Front</div>
            <h2 class="subhead_sm" style="margin-top: 0px !important;">The Palestine Campaign</h2>
            
            <hr class="basic">
            
            <div class="display-text">In late 1917, the Egyptian Expeditionary Force (EEF) launched a major offensive against the Ottoman Empire in the Middle Eastern theatre. Supported by heavy artillery units like the 380th Siege Battery of the Royal Garrison Artillery, which was attached to XXI Corps, the Allied forces sought to break the long-standing stalemate in the region.
            <br />
            <br />
            Following the strategic capture of Beersheba in early November, the EEF successfully took Gaza and pushed relentlessly northward along the Mediterranean coast. Operating on the left flank, the XXI Corps overcame difficult terrain and stiff Ottoman resistance. This steady advance culminated in the historic capture of Jerusalem in early December 1917, fundamentally shifting the balance of power in Palestine. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-beyond-western.html#palestine">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                Heavy fighting through the desert and rocky hills claimed valuable local lives across the Eastern theater. 24-year-old <a href="/oakdalewarmemorial/ww1/evans_d_j.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Gunner David John Evans</a>, who served in the heavy artillery during these grueling coastal advances &mdash; died of wounds shortly after Jerusalem fell.
            </div>
