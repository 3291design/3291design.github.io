            <div class="war-front">The Return Home</div>
            <h2 class="subhead_sm" style="letter-spacing: 0px;">Labour Corps & Post-War Hospitals</h2>
            
            <hr class="basic">
            
            <div class="display-text">As the scale of the First World War expanded, the immense logistical requirements of the Western Front necessitated the creation of the Labour Corps in 1917. Thousands of soldiers—many older or recovering from previous wounds—transferred to these units to build railways, maintain roads, and manage vital supply lines under grueling conditions.
            <br />
            <br />
            The casualty toll did not end with the signing of the Armistice in November 1918. Many soldiers who survived the front lines were evacuated to military and auxiliary hospitals across Great Britain to recover from severe wounds, gas poisoning, or exhaustion. Facilities like Manor Hill Auxiliary Hospital in Birkenhead provided long-term care for convalescing servicemen. <br />
            <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-return-home.html#long-shadow">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                For older men like 47-year-old stone cutter <a href="/oakdalewarmemorial/ww1/dyer_a_e.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Albert Edward Dyer</a>—who initially landed in France in May 1915 with the King's Own Yorkshire Light Infantry—the journey home ended tragically. Succumbing to his wounds on 6 April 1919, months after the fighting ceased, he died in a military hospital far from the Welsh valleys before final burial in the local Woodfieldside chapelyard.
            </div>
