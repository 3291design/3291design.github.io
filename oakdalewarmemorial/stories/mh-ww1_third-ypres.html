            <div class="war-front">The Western Front</div>
            <h2 class="subhead_sm">Passchendaele (Third Ypres)</h2>
            
            <hr class="basic">
            
            <div class="display-text">In the summer of 1917, the Allied offensive shifted back north to the Ypres Salient. What began as a strategic push quickly deteriorated into one of the most infamous nightmares of military history. The heaviest rainfall in decades turned the artillery-pulverized battlefield into a bottomless, liquefied wasteland of glutinous mud.
            <br />
            <br />
            The Monmouthshires were tasked with the impossible job of laying duckboards and maintaining supply tracks under relentless German shelling. Simply surviving the environment required superhuman effort, with every yard of progress paid for in blood and sheer exhaustion. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#third-ypres-1917">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The tragedy of Passchendaele struck deeply into the heart of Oakdale, as families received news that their sons had been swallowed by the Flanders mud. In these apocalyptic conditions, local men including <a href="/oakdalewarmemorial/ww1/phillips_g.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Private Gilbert Phillips</a>, <a href="/oakdalewarmemorial/ww1/coombs_t_g.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Private Thomas G. Coombs</a>, and <a href="/oakdalewarmemorial/ww1/rees_d_j.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Private David J. Rees</a> gave their lives.
            </div>
