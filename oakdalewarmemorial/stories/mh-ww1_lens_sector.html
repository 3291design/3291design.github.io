            <hr class="basic">
            
            <div class="display-text">By early 1917, the conflict had devolved into a grinding contest of attrition. For the men of the Monmouthshire Pioneer battalions, the ruins of the French coal-mining city of Lens presented an eerily familiar yet utterly devastated landscape. The once-thriving collieries had been transformed into formidable fortified redoubts.
            <br />
            <br />
            In this shattered industrial sector, the valley boys utilized their mining background to navigate, tunnel, and survive amidst the rubble. It was a grueling urban siege marked by constant sniper fire, sudden trench raids, and devastating artillery bombardments. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#lens-sector-1917">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The physical toll of operating in a landscape choked with poison gas and pulverized debris was immense. Pioneers like <a href="/oakdalewarmemorial/ww1/onions_w_j.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. William Jones Onions</a> and <a href="/oakdalewarmemorial/ww1/workman_w.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Rifleman Wyndham Workman</a> worked exhaustively to maintain the defensive network and fell during these claustrophobic engagements.
            </div>
