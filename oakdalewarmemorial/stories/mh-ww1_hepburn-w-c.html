            <hr class="main" style="margin: 15px auto; width: 100%;">
            
            <div class="display-text">As the first manager of the Oakdale Colliery, W.C. Hepburn oversaw the massive engineering project of sinking the initial shafts starting in 1907. He deployed to France as a Captain with the 1st Battalion of the Monmouthshire Regiment in 1915.
            <br />
            <br />
            Because of his extensive technical background in deep-shaft mining, the army quickly transferred him to the Royal Engineers, where his skills were utilized to engineer strategic mines and listening galleries under the trenches of the Western Front.
            <br />
            <br />
            Major William Clay Hepburn (W.C. Hepburn) lived in the heart of the community he helped build — residing in the Sirhowy Valley area around Oakdale and Blackwood as the Mining Agent for the Tredegar Iron and Coal Company.</div>
