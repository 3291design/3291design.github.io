            <div class="war-front">Italian Campaign</div>
            <h2 class="subhead_sm">Anzio Beachhead & Defensive Struggles</h2>
            
            <hr class="basic">
            
            <div class="display-text">
                The amphibious assault at Anzio in January 1944 aimed to break the stalemate in Italy by landing behind German lines. Instead, fierce enemy counter-attacks contained the Allied force in a narrow coastal bridgehead subjected to continuous artillery bombardment from the nearby Alban Hills.
                <br /><br />
                For four agonizing months, anti-aircraft gunners and infantrymen held the waterlogged perimeter under constant shellfire, air attack, and heavy armored assaults. The static defensive battle turned the beachhead into a severe survival zone before Allied forces broke out toward Rome. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww2/ww2-italian-campaign.html#anzio-beachhead">Read more...</a>
            </div>
            
            <hr class="main">
            
            <!-- Shared Casualty Replica Block (Section 1 Serviceman) -->
            <div class="casualty-highlight-box" style="margin-top: 30px;">
