            <div class="display-text">
                British and Commonwealth forces fought grueling land campaigns across North Africa, facing Italian and German forces in the blistering deserts of Egypt and Libya before being deployed to defend Greece against invading Axis armies in early 1941.
                <br /><br />
                Faced with heavy air bombardment and mountain choke points, Allied infantry executed fierce rearguard actions down the Greek peninsula to cover evacuations, while desert troops endured choking sandstorms, severe water rationing, and extreme temperature swings. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww2/ww2-mediterranean.html#egypt-greece">Read more...</a>
