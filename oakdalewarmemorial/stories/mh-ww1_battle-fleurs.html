            <div class="war-front">The Western Front</div>
            <h2 class="subhead_sm" style="margin-top: 0px !important;">Battle of Flers-Courcelette</h2>
            
            <hr class="basic">
            
            <div class="display-text">Launched in September 1916, the Battle of Flers-Courcelette was a major offensive within the larger <a href="/oakdalewarmemorial/stories/mh-ww1_somme.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Somme Campaign</a>. It is perhaps most famous for marking the first time tanks were used on a battlefield. The objective was to punch a decisive hole in the German defensive lines using this new armored technology alongside infantry assaults.
            <br />
            <br />
            Despite the initial shock value of the tanks and some tactical gains—including the capture of the villages of Flers and Courcelette—the offensive eventually bogged down in the mud and fierce German counter-attacks. The infantry endured horrific conditions, advancing over heavily cratered ground under relentless artillery and machine-gun fire. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#the-somme-1916">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The brutal reality of this renewed push on the Somme exacted a heavy toll on the men from South Wales. <a href="/oakdalewarmemorial/ww1/rowlands_e_s.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pioneer Edmund Rowlands</a> fought and ultimately fell during this devastating phase of the campaign, his sacrifice forever linked to one of the most intense and technologically transformative battles of the First World War.
            </div>
        </div>
