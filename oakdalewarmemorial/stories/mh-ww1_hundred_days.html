            <div class="war-front">The Western Front</div>
            <h2 class="subhead_sm">The 100 Days Offensive</h2>
            <hr class="main" style="margin: 15px auto; width: 100%;">
            
            <div class="display-text">Beginning with the pivotal Battle of Amiens in August 1918, the 100 Days Offensive marked the final, decisive period of the First World War. Coordinated Allied forces launched a series of rapid, relentless counter-attacks that finally broke through the heavily fortified Hindenburg Line and systematically drove the exhausted German army into retreat across the Western Front.
            <br />
            <br />
            Welsh divisions and Pioneer battalions were heavily involved in these aggressive advances across the Somme and Picardy sectors. While the offensive succeeded in bringing the war to an end by November, the cost was staggering, as attacking entrenched machine-gun positions and conducting open warfare resulted in massive casualties. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#hundred-days-1918">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The physical toll of constant marching and daily combat was staggering. Pushing relentlessly across Picardy and back into the pulverized landscapes around Cambrai, the Allied forces faced fierce, determined rearguard resistance from German machine-gunners. During these final, victorious but incredibly costly months of continuous motion, Oakdale soldiers such as <a href="/oakdalewarmemorial/ww1/paulk_w_j.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Private William Paulk</a> and <a href="/oakdalewarmemorial/ww1/daniels_j.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Private Jehoida Daniels</a> laid down their lives just as the end of the conflict finally came into sight.
            </div>
