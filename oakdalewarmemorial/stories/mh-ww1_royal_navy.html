            <div class="war-front">Beyond the Western Front | The War at Sea</div>
            <h2 class="subhead_sm">Royal Navy Service</h2>
            
            <hr class="basic">

            <div class="display-text">The Royal Navy played an indispensable role during the First World War, tasked with enforcing naval blockades, securing vital sea lanes, and protecting troop transports across global theaters. Sailors enduring the war at sea faced not only the constant threat of enemy surface fleets, U-boats, and naval mines, but also the grueling physical toll of continuous service in harsh, confined maritime conditions.
            <br />
            <br />
            Throughout the conflict, men from the valleys served aboard various classes of warships, operating extensively from the treacherous waters of the North Sea to strategic operations in the Mediterranean and the Dardanelles. 
            <br />
            <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-beyond-western.html#global-legacy">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The cramped, damp conditions below deck proved just as deadly as enemy artillery. In August 1917, <a href="/oakdalewarmemorial/ww1/nelmes_i_j.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Able Seaman Ivor James Nelmes</a> was invalided out of active service suffering from advanced tuberculosis. Having returned home to Monmouthshire to recuperate, he ultimately succumbed to the illness at the end of 1918 at the age of 20. His loss serves as a poignant reminder that the cost of this worldwide sacrifice touched every corner of the globe, and every branch of service.
            </div>
        </div>
