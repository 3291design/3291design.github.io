            <div class="war-front">The Western Front</div>
            <h2 class="subhead_sm">The 2nd Battle of Ypres</h2>
            
            <hr class="basic">
            
            <div class="display-text">The Second Battle of Ypres, fought between 22 April and 25 May 1915, marked one of the most harrowing chapters of the First World War on the Western Front. It was here that chlorine gas was first used on a mass scale, turning the Belgian countryside into a suffocating battleground as Allied forces desperately fought to hold the salient around Ypres against relentless German assaults.
            <br />
            <br />
            For territorial battalions like the Monmouths, holding the line meant enduring relentless artillery bombardments, miserable weather, poison gas, and ferocious close-quarter engagements across exposed ridges and improvised trench systems. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#ypres-1915">Read more...</a>
            </div>

            <hr class="main">

           <div class="casualty-highlight-box" style="margin-top: 30px;">
                The brutal cost of these defensive operations—especially during the catastrophe of 8 May is remembered in the valleys as "Monmouthshire's Black Day" and immortalized in the sacrifice of our local men. These include <a href="/oakdalewarmemorial/ww1/symons_f_j.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Frederick John Symons</a>, <a href="/oakdalewarmemorial/ww1/havard_t_b.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Thomas Benjamin Havard</a>, and <a href="/oakdalewarmemorial/ww1/williams_p_a.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Phillip Arthur Williams</a>, all killed in action during the desperate defense of Frezenberg Ridge and Verlorenhoek on 8 May 1915 and commemorated on the Menin Gate; alongside <a href="/oakdalewarmemorial/ww1/lovell_g.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Lance Corporal George Lovell</a> killed in action on 13 May 1915, who rests in the Bailleul Communal Cemetery Extension.
            </div>
