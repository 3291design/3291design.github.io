            <div class="war-front">Beyond the Western Front</div>
            <h2 class="subhead_sm">The Gallipoli Campaign</h2>
            
            <hr class="basic">
            
            <div class="display-text">The Gallipoli Campaign of 1915 was an ambitious Allied attempt to knock the Ottoman Empire out of the First World War and open a sea route to Russia. Fought across the rugged, unforgiving terrain of the Gallipoli peninsula in modern-day Turkey, the campaign quickly bogged down into a grueling, static nightmare of heavily fortified trench systems against over-powering odds. Additionally, poor rations, blistering heat, limited access to water, dysentery and rampant disease added to the difficulties.
            <br />
            <br />
            Troops faced intense enemy fire from high ground while clinging desperately to narrow beachheads. Units like the Royal Naval Division, Royal Marines Divisional Engineers, and the Mediterranean Expeditionary Force were thrust into the thick of the fighting, spearheading brutal high-altitude assaults and holding vital sectors such as the Helles Front. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-beyond-western.html#gallipoli-1915">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The futile campaign claimed the lives of many brave valley men, including <a href="/oakdalewarmemorial/ww1/watkins_e.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Edward Watkins</a> of the 4th South Wales Borderers, who sustained fatal wounds and died on a hospital ship on 24 August 1915; <a href="/oakdalewarmemorial/ww1/lloyd_w_a.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Sapper William Arthur Lloyd</a> of the Royal Marines Divisional Engineers, who was killed in action on 30 November 1915, at the Helles Front and <a href="/oakdalewarmemorial/ww1/fisher_s.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Samuel Fisher</a>, who faced the severe trials of the Mediterranean operations before returning wounded to the UK, where he eventually succumbed to pneumonia on 25 July 1917, at the age of 44.
            </div>
