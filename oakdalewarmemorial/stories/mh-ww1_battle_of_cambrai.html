            <hr class="basic">
            
            <div class="display-text">Late in 1917, the British Army launched a revolutionary offensive at Cambrai, using massed formations of tanks to smash through the barbed wire of the Hindenburg Line. The initial assault was a stunning success, with Monmouthshire men advancing to consolidate newly captured trenches and repair infrastructure.
            <br />
            <br />
            However, the triumph was short-lived. Within days, a massive German counter-offensive utilizing elite stormtrooper tactics pushed the British back into a desperate defensive scramble amidst sudden, chaotic enemy saliencies. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#cambrai-1917">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The bitter frost and brutal fighting turned the battlefield into a lethal proving ground. Amidst this ferocious back-and-forth struggle that defined the end of the year, Oakdale soldiers like <a href="/oakdalewarmemorial/ww1/havard_e.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Lance Corporal Ernest Havard</a> and <a href="/oakdalewarmemorial/ww1/shaw_f.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Frank Shaw</a> made the ultimate sacrifice.
