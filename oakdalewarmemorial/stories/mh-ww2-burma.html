            <h2 class="subhead_sm" style="letter-spacing: -.15px;">Burma Campaign</h2>
            
            <hr class="basic">
            
            <div class="display-text" style="letter-spacing: -.15px;">
                General Slim’s Fourteenth Army—the "Forgotten Army"—fought a grueling campaign through the dense jungle mountains of Burma. Infantrymen faced torrential monsoon rains, malaria, and fierce close-quarters combat to break Japanese lines at Kohima and Mandalay before driving south toward Rangoon.
                <br /><br />
                For servicemen captured during the early fall of Malaya and Singapore, captivity brought forced labor on the infamous Burma-Siam Death Railway, where thousands succumbed to starvation and disease. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww2/ww2-far-east.html#burma-campaign">Read more...</a>
            </div>
            
            <hr class="main">
            
            <!-- Shared Casualty Replica Block (Section 1 Servicemen) -->
            <div class="casualty-highlight-box" style="margin-top: 30px;">
