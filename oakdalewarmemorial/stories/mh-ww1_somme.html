            <hr class="basic">
            
            <div class="display-text">As the conflict raged through the summer of 1916, the unprecedented scale of the Battle of the Somme drew the pioneer battalions into a mechanized vortex. The sheer volume of artillery fire obliterated the landscape, making the Pioneer units essential for maintaining the offensive's momentum.
            <br />
            <br />
            Working above ground, exposed, carrying heavy materials through deep mud and barbed wire, the pioneers dug communication trenches and repaired supply roads under constant bombardment. The casualty rates for these supporting units mounted heavily as they operated directly behind the advancing infantry waves. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#the-somme-1916">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The devastating cost of the Somme and the fierce engagements around Guillemont echoed deeply in the Sirhowy Valley. This grueling pioneer work is immortalized by soldiers such as <a href="/oakdalewarmemorial/ww1/rowlands_e_s.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pioneer Edmund S. Rowlands</a>, <a href="/oakdalewarmemorial/ww1/farrell_m.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Michael Farrell</a>, <a href="/oakdalewarmemorial/ww1/john_j_r.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Lance Corporal John Richard John</a>, <a href="/oakdalewarmemorial/ww1/prosser_e.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Earnest Prosser</a>, and <a href="/oakdalewarmemorial/ww1/john_w_c.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. William Charles John</a>, all of whom fell during the relentless 1916 operations.
