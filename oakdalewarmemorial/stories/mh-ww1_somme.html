            <div class="war-front">The Western Front</div>
            <h2 class="subhead_sm" style="margin-top: 0px !important;">Battle of the Somme</h2>
            
            <hr class="basic">
            
            <div class="display-text">Stretching from July to November 1916, the Battle of the Somme was one of the most grueling campaigns of the war. Its unprecedented scale drew both infantry and pioneer battalions into a mechanized vortex. The sheer volume of artillery fire obliterated the landscape, demanding constant, exposed labor from Pioneer units to maintain supply lines and communication trenches through deep mud and barbed wire.
            <br />
            <br />
            The grinding, months-long offensive encompassed several fierce engagements that tested the endurance of the Welsh regiments. This included bitter fighting during the <a href="/oakdalewarmemorial/stories/mh-ww1_battle_of_guillemont.html" class="hybrid-fetch-trigger" data-target="sidebar">Battle of Guillemont</a> in early September, and the technologically transformative tank assaults of the <a href="/oakdalewarmemorial/stories/mh-ww1_battle-fleurs.html" class="hybrid-fetch-trigger" data-target="sidebar">Battle of Flers-Courcelette</a> weeks later. Whether advancing over cratered ground or repairing roads under relentless bombardment, the casualty rates mounted heavily. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-western-front.html#the-somme-1916">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                The devastating cost of the broader Somme Campaign echoed deeply in the Sirhowy Valley, claiming the lives of five local men. This staggering loss is immortalized by soldiers such as <a href="/oakdalewarmemorial/ww1/rowlands_e_s.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pioneer Edmund S. Rowlands</a>, <a href="/oakdalewarmemorial/ww1/farrell_m.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Michael Farrell</a>, <a href="/oakdalewarmemorial/ww1/john_j_r.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Lance Corporal John Richard John</a>, <a href="/oakdalewarmemorial/ww1/prosser_e.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Earnest Prosser</a>, and <a href="/oakdalewarmemorial/ww1/john_w_c.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. William Charles John</a>, all of whom fell during the relentless 1916 operations.
            </div>
