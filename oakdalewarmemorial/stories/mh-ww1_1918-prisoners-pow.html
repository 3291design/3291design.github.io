            <div class="war-front">Prisoners &amp; The Missing</div>
            <h2 class="subhead_sm">Pioneer Battalions & Prisoner of War Camps</h2>
            
            <hr class="basic">
            
            <div class="display-text">During the turbulent mobile warfare of 1918, pioneer battalions like the 1st/7th Battalion, Durham Light Infantry (serving as the 50th Division's pioneers) faced unprecedented strain. Tasked with constructing defenses, repairing blown infrastructure under fire, and frequently acting as emergency infantry during desperate defensive stands, they were on the front lines of the collapsing German Spring Offensives and subsequent Allied advances.
            <br />
            <br />
            In the chaos of these fluid, high-casualty engagements, many soldiers were cut off and captured. Taken behind enemy lines, prisoners faced severe privation, grueling labor, and rampant disease in camps across Germany, such as Niederzwehren, Kassel. <span class="pointer">&#9658;&nbsp;</span><a href="/oakdalewarmemorial/ww1/ww1-prisoners-missing.html#captivity">Read more...</a>
            </div>

            <hr class="main">

            <div class="casualty-highlight-box" style="margin-top: 30px;">
                Navigating this psychological and physical torment required immense resilience. While some men managed to endure the years of confinement until the Armistice finally opened the gates, others found that survival did not end with the ceasefire. In the chaotic post-war weeks, amidst a crippled German infrastructure and the ravages of the global Spanish Flu pandemic, vulnerable men succumbed in tragic limbo before repatriation could be achieved. Valley soldiers like <a href="/oakdalewarmemorial/ww1/davies_t.html" class="hybrid-fetch-trigger soldier-link" data-target="full-view">Pte. Thomas Davies</a> faced this heartbreaking final hurdle, passing away far from home just as peace was declared.
            </div>
        
        </div>
