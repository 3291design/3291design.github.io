 <!-- ==========================================================================
     OAKDALE WAR MEMORIAL - MAP TEMPLATE SNIPPET (map-template-snippet.html)
     Purpose: Stores interactive campaign maps for dynamic Lightbox injection.
     File Version: v2.0 (2026 Refactor)
     Notes: Major architecture update. Converted from legacy modal divs to 
            <template> tags. Legacy close buttons and background links have

            and odw-common.js (v5.10+).

<!-- ========================================== -->
<!-- 1. The Western Front Map Modal             -->
<!-- ========================================== -->

<template id="modal-western-map">
    <div class="wide-map-modal">
        <div class="subhead_sm" style="text-align: center; margin: 0px auto 20px auto; font-size: 1.2em; font-weight: bold;">
            Fig. 1 - The Western Front - 1915
        </div>

        <div class="map-interactive-wrapper" style="margin-top: 20px;">
            <div class="map-zoom-controls-overlay">
                <button class="zoom-in-btn" title="Zoom In">+</button>
                <button class="zoom-out-btn" title="Zoom Out">&minus;</button>
            </div>

            <div class="map-scroll-container pan-container">
                <div class="full-master-img map-coordinate-system map-target" style="max-width: none !important; height: auto; position: absolute; top: 0; left: 0;">
                    <img src="/oakdalewarmemorial/images/WW1-Alliances-Map_16c.jpg" alt="Master Map" style="width: 100%; max-width: none; display: block; user-select: none; -webkit-user-drag: none;">
                    
                    <div class="map-pin" style="top: 45.25%; left: 28.25%;">
                        <div class="pin-tooltip">Ypres Salient</div>                    
                    </div>
                    <div class="map-pin" style="top: 46.25%; left: 28%;">
                        <div class="pin-tooltip">Armentières Sector</div>                    
                    </div>
                    <div class="map-line-dashed" style="top: 52.5%; left: 28.5%; width: 7%; transform: rotate(-98deg);" title="The Western Front"></div>
                </div> 
            </div> 
        </div> 
        
        <div class="plain-text" style="text-align: center; margin-bottom: 0; margin-top: 15px;">
            [ Right-click to zoom-in (+), left-click to zoom-out (-) then click &amp; drag to explore the map. ]
        </div>
    </div>
</template><!------ END TEMPLATE BLOCK ------>
